<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="白黒のシンプルなTodo・ルーティーントラッカー。" />
  <title>MONO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0d'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='white' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: light; --ink:#101010; --paper:#f7f7f5; --muted:#858580; --line:#d9d9d4; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:"Helvetica Neue","Hiragino Sans","Yu Gothic",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; color:inherit; }
    button { cursor:pointer; }
    :focus-visible { outline:2px solid var(--ink); outline-offset:4px; }

    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(22px,5vw,64px); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:9px; font-size:.78rem; font-weight:700; letter-spacing:.14em; }
    .brand i { width:8px; height:8px; border-radius:50%; background:var(--ink); }
    .date { font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums; }

    main { width:min(960px,calc(100% - 40px)); margin:0 auto; padding:clamp(56px,9vw,104px) 0 140px; }
    section { padding:0 0 clamp(72px,11vw,128px); }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:38px; }
    .section-head h1,.section-head h2 { margin:0; font-size:.78rem; line-height:1; letter-spacing:.16em; font-weight:700; }
    .section-head span { font-size:.72rem; color:var(--muted); }

    .today-section { min-height:220px; }
    .task-list { width:min(720px,100%); }
    .empty { padding:22px 0; color:var(--muted); font-size:.86rem; }

    .today-routines { margin-top:32px; padding-top:18px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sub-label { margin-right:10px; font-size:.64rem; color:var(--muted); letter-spacing:.12em; }
    .routine-pill { height:28px; border:1px solid var(--ink); border-radius:999px; background:transparent; padding:0 11px; font-size:.68rem; transition:.18s; }
    .routine-pill.done { background:var(--ink); color:var(--paper); }

    .later { border-top:1px solid var(--line); padding-top:34px; }
    .task-row { min-height:56px; display:grid; grid-template-columns:18px minmax(0,1fr) 24px; align-items:center; gap:12px; border-bottom:1px solid var(--line); }
    .check { display:block; width:15px; height:15px; padding:0; border:1px solid var(--ink); border-radius:3px; background:transparent; transition:background .16s; }
    .check:hover { background:var(--ink); }
    .task-content { position:relative; width:100%; min-width:0; min-height:55px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:0 8px 0 0; border:0; border-radius:0; background:transparent; text-align:left; }
    .task-content:hover .row-title,.task-content:focus-visible .row-title { text-decoration:underline; text-underline-offset:4px; }
    .row-name { min-width:0; display:flex; align-items:center; gap:9px; }
    .group-dot { flex:none; width:8px; height:8px; border-radius:50%; background:var(--group-color); }
    .row-title { min-width:0; font-size:.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row-meta { font-size:.68rem; color:var(--muted); white-space:nowrap; }
    .note-popover { position:absolute; left:0; top:calc(100% - 4px); z-index:8; visibility:hidden; width:max-content; max-width:min(330px,76vw); padding:10px 12px; border-radius:8px; color:var(--paper); background:var(--ink); box-shadow:0 9px 26px rgba(0,0,0,.18); font-size:.72rem; line-height:1.6; white-space:normal; overflow-wrap:anywhere; opacity:0; transform:translateY(-3px); transition:opacity .15s,transform .15s,visibility .15s; pointer-events:none; }
    .task-content:hover .note-popover,.task-content:focus-visible .note-popover { visibility:visible; opacity:1; transform:translateY(0); }
    .delete { border:0; background:transparent; padding:0; opacity:.28; font-size:1rem; }
    .delete:hover { opacity:1; }

    .routines { border-top:1px solid var(--line); padding-top:30px; padding-bottom:0; }
    .routines .section-head { margin-bottom:20px; }
    .tracker-wrap { width:min(560px,100%); overflow-x:auto; padding-bottom:8px; }
    .tracker { min-width:440px; }
    .tracker-head,.tracker-row { display:grid; grid-template-columns:minmax(160px,1fr) repeat(7,18px); align-items:center; gap:8px; }
    .tracker-head { height:25px; font-size:.58rem; color:var(--muted); text-align:center; }
    .tracker-row { min-height:36px; border-top:1px solid var(--line); }
    .routine-info { min-width:0; display:flex; align-items:center; gap:6px; }
    .routine-name { min-width:0; flex:1; font-size:.72rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .routine-action { width:22px; height:22px; padding:0; border:0; background:transparent; color:var(--muted); font-size:.68rem; opacity:.5; }
    .routine-action:hover { color:var(--ink); opacity:1; }
    .day { display:block; width:18px; height:18px; border-radius:50%; border:1px solid var(--line); background:transparent; }
    .day.is-today { border-color:var(--ink); }
    .day.done { background:var(--ink); border-color:var(--ink); }

    .hangar { border-top:1px solid var(--line); padding-top:30px; padding-bottom:0; }
    .hangar .section-head { margin-bottom:18px; }
    .hangar-list { width:min(560px,100%); }
    .hangar-item { min-height:42px; display:grid; grid-template-columns:14px minmax(0,1fr) auto auto; align-items:center; gap:12px; border-top:1px solid var(--line); }
    .hangar-dot { width:9px; height:9px; border-radius:50%; background:var(--ink); opacity:.35; }
    .hangar-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:.76rem; text-decoration:line-through; }
    .hangar-time { color:var(--muted); font-size:.64rem; }
    .restore { padding:5px 9px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--muted); font-size:.65rem; }
    .restore:hover { border-color:var(--ink); color:var(--ink); }

    .groups { border-top:1px solid var(--line); padding-top:30px; padding-bottom:70px; }
    .groups .section-head { margin-bottom:18px; }
    .group-list { width:min(560px,100%); }
    .group-row { min-height:43px; display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); font-size:.76rem; }
    .group-row span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .color-input { width:28px; height:28px; padding:2px; border:1px solid var(--line); border-radius:50%; background:transparent; cursor:pointer; }
    .color-input::-webkit-color-swatch-wrapper { padding:0; }
    .color-input::-webkit-color-swatch { border:0; border-radius:50%; }
    .color-input::-moz-color-swatch { border:0; border-radius:50%; }
    .group-add { display:flex; align-items:center; gap:12px; width:min(560px,100%); margin-top:12px; }
    .group-add input { width:min(220px,65%); height:35px; padding:0 10px; border:1px solid var(--line); border-radius:6px; background:transparent; font-size:.76rem; }
    .group-add button { border:0; background:transparent; color:var(--muted); font-size:.76rem; }
    .group-add button:hover { color:var(--ink); }

    .inline-add { display:block; margin-top:18px; padding:5px 0; border:0; background:transparent; color:var(--muted); font-size:.76rem; text-align:left; }
    .inline-add[hidden] { display:none; }
    .inline-add:hover { color:var(--ink); }

    .add-button { position:fixed; right:clamp(20px,4vw,50px); bottom:28px; z-index:10; width:54px; height:54px; border:0; border-radius:50%; color:var(--paper); background:var(--ink); font-size:1.5rem; line-height:1; box-shadow:0 10px 28px rgba(0,0,0,.16); transition:transform .2s; }
    .add-button:hover { transform:scale(1.06); }

    .backdrop { position:fixed; inset:0; z-index:20; display:none; pointer-events:none; }
    .backdrop.open { display:block; }
    .composer { position:fixed; top:14vh; left:50%; transform:translateX(-50%); width:min(520px,calc(100vw - 32px)); max-height:80vh; overflow:auto; padding:26px; border:1px solid var(--ink); border-radius:16px; background:var(--paper); box-shadow:0 16px 44px rgba(0,0,0,.18); pointer-events:auto; }
    .composer-head { display:flex; align-items:center; justify-content:space-between; margin:-8px -6px 18px; padding:8px 6px; cursor:grab; user-select:none; touch-action:none; }
    .composer-head:active { cursor:grabbing; }
    .composer-head span { font-size:.7rem; font-weight:700; letter-spacing:.14em; }
    .close { border:0; background:transparent; padding:4px; font-size:1.2rem; }
    .title-input { width:100%; border:0; border-bottom:1px solid var(--ink); outline:0; background:transparent; padding:10px 0 12px; font-size:1rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:25px; }
    .field label,.field-title { display:block; margin-bottom:10px; font-size:.68rem; font-weight:700; letter-spacing:.1em; }
    .group-input,.date-input { width:100%; height:38px; padding:0 13px; border:1px solid var(--line); border-radius:999px; background:transparent; font-size:.78rem; }
    .choices { display:flex; gap:6px; flex-wrap:wrap; }
    .choice { position:relative; }
    .choice input { position:absolute; opacity:0; }
    .choice span { display:block; padding:8px 11px; border:1px solid var(--line); border-radius:999px; font-size:.7rem; }
    .choice input:checked+span { color:var(--paper); background:var(--ink); border-color:var(--ink); }
    .repeat { grid-column:1/-1; padding-top:18px; border-top:1px solid var(--line); }
    .repeat-line { display:flex; align-items:center; justify-content:space-between; font-size:.78rem; }
    .switch { width:42px; height:23px; padding:3px; border:0; border-radius:999px; background:var(--line); }
    .switch::after { content:""; display:block; width:17px; height:17px; border-radius:50%; background:var(--paper); transition:.18s; }
    .switch.on { background:var(--ink); }
    .switch.on::after { transform:translateX(19px); }
    .weekdays { display:none; gap:6px; margin-top:16px; flex-wrap:wrap; }
    .weekdays.show { display:flex; }
    .submit-row { display:flex; justify-content:flex-end; margin-top:26px; }
    .submit { border:0; border-radius:999px; color:var(--paper); background:var(--ink); padding:11px 21px; font-size:.72rem; font-weight:700; }
    .composer.routine-mode .due-field,.composer.routine-mode .repeat-line { display:none; }
    .composer.routine-mode .weekdays { display:flex; }

    .note-backdrop { position:fixed; inset:0; z-index:22; display:none; pointer-events:none; }
    .note-backdrop.open { display:block; }
    .note-panel { position:fixed; top:22vh; right:clamp(20px,6vw,80px); width:min(390px,calc(100vw - 32px)); padding:24px; border:1px solid var(--ink); border-radius:16px; background:var(--paper); box-shadow:0 16px 44px rgba(0,0,0,.18); pointer-events:auto; }
    .note-head { display:flex; align-items:center; justify-content:space-between; margin:-7px -5px 14px; padding:7px 5px; cursor:grab; user-select:none; touch-action:none; }
    .note-head:active { cursor:grabbing; }
    .note-head span { font-size:.68rem; font-weight:700; letter-spacing:.14em; }
    .note-task-title { margin:0 0 14px; font-size:.86rem; line-height:1.45; overflow-wrap:anywhere; }
    .note-input { display:block; width:100%; min-height:130px; resize:vertical; padding:12px; border:1px solid var(--line); border-radius:10px; outline:0; background:transparent; font:inherit; font-size:.8rem; line-height:1.65; }
    .note-input:focus { border-color:var(--ink); }

    @media (max-width:700px) {
      main { width:min(100% - 32px,960px); padding-top:48px; }
      section { padding-bottom:84px; }
      .row-meta { max-width:88px; overflow:hidden; text-overflow:ellipsis; }
      .tracker-head,.tracker-row { grid-template-columns:minmax(140px,1fr) repeat(7,18px); }
      .composer { top:70px; left:10px; width:calc(100vw - 20px); max-height:calc(100vh - 90px); transform:none; padding:22px 18px; }
      .note-panel { top:80px; left:10px; right:auto; width:calc(100vw - 20px); }
      .form-grid { grid-template-columns:1fr; }
      .repeat { grid-column:1; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header><div class="brand"><i></i><span>MONO</span></div><div class="date" id="date"></div></header>
  <main>
    <section class="today-section"><div class="section-head"><h1>TODAY</h1><span id="todayCount"></span></div><div class="task-list" id="todayTasks"></div><button class="inline-add" type="button" data-add-due="today">＋ タスクを追加</button><div class="today-routines" id="todayRoutines"></div></section>
    <section class="later"><div class="section-head"><h2>THIS WEEK</h2><span id="weekCount"></span></div><div class="task-list" id="weekTasks"></div><button class="inline-add" type="button" data-add-due="tomorrow">＋ タスクを追加</button></section>
    <section class="later"><div class="section-head"><h2>LATER</h2><span id="laterCount"></span></div><div class="task-list" id="laterTasks"></div><button class="inline-add" type="button" data-add-due="nextWeek">＋ タスクを追加</button></section>
    <section class="routines"><div class="section-head"><h2>ROUTINE</h2><span id="routineCount"></span></div><div class="tracker-wrap"><div class="tracker" id="tracker"></div></div><button class="inline-add" type="button" id="addRoutine">＋ ルーティーンを追加</button></section>
    <section class="hangar"><div class="section-head"><h2>HANGAR</h2><span id="hangarCount">3 DAYS</span></div><div class="hangar-list" id="hangarList"></div></section>
    <section class="groups"><div class="section-head"><h2>GROUPS</h2><span id="groupCount"></span></div><div class="group-list" id="groupList"></div><form class="group-add" id="groupAdd"><input id="newGroup" maxlength="24" autocomplete="off" placeholder="グループ名" aria-label="新しいグループ名" required /><button type="submit">＋ グループを追加</button></form></section>
  </main>
  <button class="add-button" id="openComposer" aria-label="タスクを追加">＋</button>
  <div class="backdrop" id="backdrop" role="dialog" aria-labelledby="composerTitle">
    <form class="composer" id="composer">
      <div class="composer-head"><span id="composerTitle">NEW</span><button class="close" type="button" id="closeComposer" aria-label="閉じる">×</button></div>
      <input class="title-input" id="titleInput" maxlength="80" autocomplete="off" placeholder="タスク名" required />
      <div class="form-grid">
        <div class="field due-field"><span class="field-title">期限</span><div class="choices">
          <label class="choice"><input type="radio" name="due" value="today" checked><span>今日</span></label><label class="choice"><input type="radio" name="due" value="tomorrow"><span>明日</span></label><label class="choice"><input type="radio" name="due" value="none"><span>なし</span></label><label class="choice"><input type="radio" name="due" value="date"><span>指定</span></label>
        </div><input class="date-input" type="date" id="customDate" style="display:none;margin-top:9px" aria-label="期限の日付" /></div>
        <div class="field"><label for="groupInput">グループ</label><input class="group-input" id="groupInput" list="groups" maxlength="24" placeholder="学校 / 創作 / 個人" /><datalist id="groups"></datalist></div>
        <div class="repeat"><div class="repeat-line"><span>ルーティーン</span><button class="switch" type="button" id="repeatSwitch" role="switch" aria-checked="false" aria-label="ルーティーン設定"></button></div><div class="weekdays" id="weekdays"></div></div>
      </div>
      <div class="submit-row"><button class="submit" type="submit">追加</button></div>
    </form>
  </div>
  <div class="note-backdrop" id="noteBackdrop" role="dialog" aria-labelledby="noteTitle">
    <form class="note-panel" id="noteEditor">
      <div class="note-head"><span>MEMO</span><button class="close" type="button" id="closeNote" aria-label="閉じる">×</button></div>
      <div class="note-task-title" id="noteTitle"></div>
      <textarea class="note-input" id="noteInput" maxlength="1200" placeholder="メモを書く"></textarea>
      <div class="submit-row"><button class="submit" type="submit">保存</button></div>
    </form>
  </div>
  <script>
  (()=>{
    const STORE='mono-todo-v1', DAYS=['日','月','火','水','木','金','土'];
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], pad=n=>String(n).padStart(2,'0');
    const key=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x}, uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let state;try{state=JSON.parse(localStorage.getItem(STORE))||{tasks:[],routines:[]}}catch{state={tasks:[],routines:[]}}state.tasks||=[];state.routines||=[];state.groupColors=Object.assign(Object.create(null),state.groupColors||{});state.groups||=[];
    state.groups=[...new Set([...state.groups,...state.tasks.map(t=>t.group),...state.routines.map(r=>r.group)].filter(Boolean))];
    const PALETTE=['#557c9e','#d08a69','#78946c','#9879a8','#c5a44e','#6d9c9b','#b76e79','#777b9b'];
    const groupNames=()=>[...new Set([...state.groups,...state.tasks.map(t=>t.group),...state.routines.map(r=>r.group)].filter(Boolean))];
    const groupColor=name=>{const position=state.groups.indexOf(name),index=position<0?groupNames().indexOf(name):position,saved=state.groupColors[name];return typeof saved==='string'&&/^#[0-9a-f]{6}$/i.test(saved)?saved:PALETTE[Math.max(0,index)%PALETTE.length]};
    const registerGroup=name=>{if(name&&!state.groups.includes(name))state.groups.push(name)};
    const HANGAR_TTL=3*864e5;let storageChanged=false;const loadedAt=Date.now();state.tasks.forEach(t=>{if(t.completed&&!t.completedAt){t.completedAt=loadedAt;storageChanged=true}});const loadedCount=state.tasks.length;state.tasks=state.tasks.filter(t=>!t.completed||loadedAt-t.completedAt<HANGAR_TTL);if(storageChanged||state.tasks.length!==loadedCount)localStorage.setItem(STORE,JSON.stringify(state));
    const today=()=>key(new Date()), diff=due=>due?Math.round((new Date(`${due}T00:00:00`)-new Date(`${today()}T00:00:00`))/864e5):9999;
    const daysLeftThisWeek=()=>((7-new Date().getDay())%7);
    const dueLabel=due=>{if(!due)return'期限なし';const n=diff(due);if(n<0)return`${-n}日超過`;if(n===0)return'今日';if(n===1)return'明日';const d=new Date(`${due}T00:00:00`);return`${d.getMonth()+1}/${d.getDate()}`};
    const score=t=>{const n=diff(t.due);return n<0?-10000+n:n===0?-9000:n===1?-7000:t.due?n:10000+(t.createdAt||0)/1e12}, tasks=()=>state.tasks.filter(t=>!t.completed).sort((a,b)=>score(a)-score(b)), hangarTasks=()=>state.tasks.filter(t=>t.completed&&t.completedAt&&Date.now()-t.completedAt<HANGAR_TTL).sort((a,b)=>b.completedAt-a.completedAt);
    const occurs=(r,d)=>r.days.includes(d.getDay()), save=()=>{localStorage.setItem(STORE,JSON.stringify(state));render()};
    function taskRow(t){const memo=String(t.note||'').trim(),meta=[t.group,t.due?dueLabel(t.due):''].filter(Boolean).join(' · ')+(memo?' · メモ':'');return`<div class="task-row"><button class="check" data-complete="${t.id}" aria-label="${esc(t.title)}を完了"></button><button class="task-content" data-task="${t.id}" aria-label="${esc(t.title)}のメモを編集"><span class="row-name">${t.group?`<i class="group-dot" style="--group-color:${groupColor(t.group)}" aria-hidden="true"></i>`:''}<span class="row-title">${esc(t.title)}</span></span><span class="row-meta">${esc(meta)}</span>${memo?`<span class="note-popover" role="tooltip">${esc(memo).replace(/\n/g,'<br>')}</span>`:''}</button><button class="delete" data-delete="${t.id}" aria-label="削除">×</button></div>`}
    function render(){
      pruneHangar();const d=new Date(),all=tasks(),last=daysLeftThisWeek(),now=[],week=[],later=[];
      for(const t of all){const n=diff(t.due);if(t.due&&n<=0)now.push(t);else if(t.due&&n<=last)week.push(t);else later.push(t)}
      $('#date').textContent=`${pad(d.getMonth()+1)}.${pad(d.getDate())} ${DAYS[d.getDay()]}`;
      $('#todayCount').textContent=now.length;$('#todayTasks').innerHTML=now.length?now.map(taskRow).join(''):`<div class="empty">今日のタスクはない。</div>`;
      const daily=state.routines.filter(r=>occurs(r,d));$('#todayRoutines').innerHTML=`<span class="sub-label">ROUTINE</span>`+(daily.length?daily.map(r=>`<button class="routine-pill ${r.checks[today()]?'done':''}" data-routine="${r.id}" aria-pressed="${!!r.checks[today()]}">${esc(r.title)}</button>`).join(''):`<span class="row-meta">なし</span>`);
      $('#weekCount').textContent=week.length;$('#weekTasks').innerHTML=week.length?week.map(taskRow).join(''):`<div class="empty">今週の予定はない。</div>`; $('[data-add-due="tomorrow"]').hidden=last===0;
      $('#laterCount').textContent=later.length;$('#laterTasks').innerHTML=later.length?later.map(taskRow).join(''):`<div class="empty">予定はない。</div>`;
      renderTracker();renderHangar();renderGroups()
    }
    function renderTracker(){const dates=Array.from({length:7},(_,i)=>add(new Date(),i-6));const head=`<div class="tracker-head"><span></span>${dates.map(d=>`<span>${d.getDate()}<br>${DAYS[d.getDay()]}</span>`).join('')}</div>`;const rows=state.routines.map(r=>`<div class="tracker-row"><span class="routine-info"><span class="routine-name">${esc(r.title)}</span><button class="routine-action" data-edit-routine="${r.id}" aria-label="${esc(r.title)}を編集">編集</button><button class="routine-action" data-delete-routine="${r.id}" aria-label="${esc(r.title)}を削除">×</button></span>${dates.map(d=>{const k=key(d);return`<span class="day ${r.checks[k]?'done':''} ${k===today()?'is-today':''}" aria-label="${esc(r.title)} ${k} ${r.checks[k]?'完了':'未完了'}"></span>`}).join('')}</div>`).join('');$('#tracker').innerHTML=head+(rows||`<div class="empty">ルーティーンはない。</div>`);$('#routineCount').textContent=state.routines.length}
    function pruneHangar(){const before=state.tasks.length;state.tasks=state.tasks.filter(t=>!t.completed||!t.completedAt||Date.now()-t.completedAt<HANGAR_TTL);if(state.tasks.length!==before)localStorage.setItem(STORE,JSON.stringify(state))}
    function renderHangar(){const items=hangarTasks();$('#hangarCount').textContent=items.length?`${items.length} · 3 DAYS`:'3 DAYS';$('#hangarList').innerHTML=items.length?items.map(t=>{const left=Math.max(1,Math.ceil((HANGAR_TTL-(Date.now()-t.completedAt))/864e5));return`<div class="hangar-item"><i class="hangar-dot"></i><span class="hangar-title">${esc(t.title)}</span><span class="hangar-time">あと${left}日</span><button class="restore" data-restore="${t.id}">復帰</button></div>`}).join(''):`<div class="empty">空。</div>`}
    function renderGroups(){const names=groupNames();$('#groupCount').textContent=names.length;$('#groupList').innerHTML=names.length?names.map(name=>`<label class="group-row"><input class="color-input" type="color" value="${groupColor(name)}" data-color-group="${esc(name)}" aria-label="${esc(name)}の色" /><span>${esc(name)}</span></label>`).join(''):`<div class="empty">グループはない。</div>`;$('#groups').innerHTML=names.map(name=>`<option value="${esc(name)}"></option>`).join('')}
    function toggleRoutine(id,k=today()){const r=state.routines.find(x=>x.id===id);if(!r)return;r.checks[k]=!r.checks[k];save()}
    function complete(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.completed=true;t.completedAt=Date.now();save()}
    function restoreTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.completed=false;delete t.completedAt;save()}
    const backdrop=$('#backdrop'),form=$('#composer'),title=$('#titleInput'),noteBackdrop=$('#noteBackdrop'),noteEditor=$('#noteEditor'),noteInput=$('#noteInput');let repeat=false,composerMode='task',editingRoutineId=null,editingTaskId=null;
    const setRepeat=value=>{repeat=value;$('#repeatSwitch').classList.toggle('on',value);$('#repeatSwitch').setAttribute('aria-checked',String(value));$('#weekdays').classList.toggle('show',value)};
    const resetComposer=()=>{form.reset();composerMode='task';editingRoutineId=null;form.classList.remove('routine-mode');setRepeat(false);$('#customDate').style.display='none'};
    const openTask=(preset='today')=>{closeNote();resetComposer();if(preset==='nextWeek'){preset='date';$('#customDate').value=key(add(new Date(),daysLeftThisWeek()+1));$('#customDate').style.display='block'}const due=$(`input[name="due"][value="${preset}"]`)||$('input[name="due"][value="today"]');due.checked=true;$('#composerTitle').textContent='NEW TASK';backdrop.classList.add('open');setTimeout(()=>title.focus(),60)};
    const openRoutine=(id=null)=>{closeNote();resetComposer();composerMode='routine';editingRoutineId=id;form.classList.add('routine-mode');setRepeat(true);$('#composerTitle').textContent=id?'EDIT ROUTINE':'NEW ROUTINE';const r=id?state.routines.find(x=>x.id===id):null;if(r){title.value=r.title;$('#groupInput').value=r.group||'';$$('input[name="weekday"]').forEach(x=>x.checked=r.days.includes(+x.value))}backdrop.classList.add('open');setTimeout(()=>title.focus(),60)};
    const close=()=>{backdrop.classList.remove('open');resetComposer()};
    const openNote=id=>{const t=state.tasks.find(x=>x.id===id);if(!t)return;close();editingTaskId=id;$('#noteTitle').textContent=t.title;noteInput.value=t.note||'';noteBackdrop.classList.add('open');setTimeout(()=>noteInput.focus(),60)};
    const closeNote=()=>{editingTaskId=null;noteBackdrop.classList.remove('open');noteEditor.reset()};
    document.addEventListener('click',e=>{const c=e.target.closest('[data-complete]'),d=e.target.closest('[data-delete]'),restore=e.target.closest('[data-restore]'),editRoutine=e.target.closest('[data-edit-routine]'),deleteRoutine=e.target.closest('[data-delete-routine]'),task=e.target.closest('[data-task]'),r=e.target.closest('[data-routine]');if(c)complete(c.dataset.complete);else if(d){if(editingTaskId===d.dataset.delete)closeNote();state.tasks=state.tasks.filter(t=>t.id!==d.dataset.delete);save()}else if(restore)restoreTask(restore.dataset.restore);else if(editRoutine)openRoutine(editRoutine.dataset.editRoutine);else if(deleteRoutine){state.routines=state.routines.filter(x=>x.id!==deleteRoutine.dataset.deleteRoutine);save()}else if(task)openNote(task.dataset.task);else if(r)toggleRoutine(r.dataset.routine,r.dataset.key||today())});
    $('#groupList').addEventListener('change',e=>{const input=e.target.closest('[data-color-group]');if(!input)return;state.groupColors[input.dataset.colorGroup]=input.value;save()});
    $('#groupAdd').addEventListener('submit',e=>{e.preventDefault();const name=$('#newGroup').value.trim();if(!name)return;registerGroup(name);$('#newGroup').value='';save()});
    $('#openComposer').onclick=()=>openTask('today');$$('[data-add-due]').forEach(button=>button.onclick=()=>openTask(button.dataset.addDue));$('#addRoutine').onclick=()=>openRoutine();$('#closeComposer').onclick=close;$('#closeNote').onclick=closeNote;backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});noteBackdrop.addEventListener('click',e=>{if(e.target===noteBackdrop)closeNote()});$('#repeatSwitch').onclick=()=>setRepeat(!repeat);$('#weekdays').innerHTML=DAYS.map((d,i)=>`<label class="choice"><input type="checkbox" name="weekday" value="${i}" checked><span>${d}</span></label>`).join('');$$('input[name="due"]').forEach(x=>x.onchange=()=>{$('#customDate').style.display=x.checked&&x.value==='date'?'block':'none'});
    function makeDraggable(panel,handle){let drag=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const rect=panel.getBoundingClientRect();panel.style.left=`${rect.left}px`;panel.style.right='auto';panel.style.top=`${rect.top}px`;panel.style.transform='none';drag={x:e.clientX-rect.left,y:e.clientY-rect.top,id:e.pointerId};handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const left=Math.max(8,Math.min(innerWidth-panel.offsetWidth-8,e.clientX-drag.x));const top=Math.max(8,Math.min(innerHeight-panel.offsetHeight-8,e.clientY-drag.y));panel.style.left=`${left}px`;panel.style.top=`${top}px`});const end=e=>{if(drag&&e.pointerId===drag.id)drag=null};handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end)}
    makeDraggable(form,$('.composer-head'));makeDraggable(noteEditor,$('.note-head'));
    form.addEventListener('submit',e=>{e.preventDefault();const name=title.value.trim();if(!name)return;const group=$('#groupInput').value.trim();if(composerMode==='routine'||repeat){const days=$$('input[name="weekday"]:checked').map(x=>+x.value);if(!days.length)return;if(editingRoutineId){const r=state.routines.find(x=>x.id===editingRoutineId);if(r){r.title=name;r.group=group;r.days=days}}else state.routines.push({id:uid(),title:name,group,days,checks:{}})}else{const preset=$('input[name="due"]:checked').value;let due='';if(preset==='today')due=today();if(preset==='tomorrow')due=key(add(new Date(),1));if(preset==='date'){due=$('#customDate').value;if(!due){$('#customDate').focus();return}}state.tasks.push({id:uid(),title:name,due,group,note:'',completed:false,createdAt:Date.now()})}registerGroup(group);close();save()});
    noteEditor.addEventListener('submit',e=>{e.preventDefault();const t=state.tasks.find(x=>x.id===editingTaskId);if(t)t.note=noteInput.value.trim();closeNote();save()});
    document.addEventListener('keydown',e=>{if((e.key==='n'||e.key==='N')&&!backdrop.classList.contains('open')&&!noteBackdrop.classList.contains('open')&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))openTask();if(e.key==='Escape'){close();closeNote()}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){if(backdrop.classList.contains('open'))form.requestSubmit();else if(noteBackdrop.classList.contains('open'))noteEditor.requestSubmit()}});
    function webMCP(){const ctx=document.modelContext;if(!ctx?.registerTool)return;const reg=t=>{try{Promise.resolve(ctx.registerTool(t)).catch(()=>{})}catch{}};reg({name:'list_open_tasks',title:'未完了タスクを見る',description:'期限順の未完了タスクを返します。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){return{tasks:tasks().map(({id,title,due,group})=>({id,title,due,group}))}}});reg({name:'create_task',title:'タスクを追加',description:'Todoを追加します。',inputSchema:{type:'object',properties:{title:{type:'string',minLength:1,maxLength:80},due:{type:'string'},group:{type:'string',maxLength:24}},required:['title'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(x){if(!x?.title?.trim())throw Error('title is required');if(x.due&&!/^\d{4}-\d{2}-\d{2}$/.test(x.due))throw Error('due must be YYYY-MM-DD');const t={id:uid(),title:x.title.trim(),due:x.due||'',group:String(x.group||'').slice(0,24),completed:false,createdAt:Date.now()};state.tasks.push(t);save();return{created:true,id:t.id}}});reg({name:'complete_task',title:'タスクを完了',description:'指定IDのTodoを完了にします。',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(x){const t=state.tasks.find(v=>v.id===x?.id);if(!t)throw Error('task not found');t.completed=true;t.completedAt=Date.now();save();return{completed:true,id:t.id}}})}
    render();webMCP();
  })();
  </script>
