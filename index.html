<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="白黒のシンプルなTodo・ルーティーントラッカー。" />
  <title>MONO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0d'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='white' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: light; --ink:#101010; --paper:#f7f7f5; --muted:#858580; --line:#d9d9d4; }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:"Helvetica Neue","Hiragino Sans","Yu Gothic",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; color:inherit; }
    button { cursor:pointer; }
    :focus-visible { outline:2px solid var(--ink); outline-offset:4px; }

    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(22px,5vw,64px); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:9px; font-size:.78rem; font-weight:700; letter-spacing:.14em; }
    .brand i { width:8px; height:8px; border-radius:50%; background:var(--ink); }
    .date { font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums; }
    .brand-group { display:flex; align-items:center; gap:24px; }
    .screen-label { font-size:.7rem; color:var(--muted); }
    .screen-nav { position:fixed; right:clamp(16px,4vw,50px); top:50%; transform:translateY(-50%); z-index:12; display:grid; gap:12px; }
    .screen-tab { display:grid; place-items:center; width:42px; height:42px; padding:0; border:1px solid var(--line); border-radius:50%; color:var(--muted); background:var(--paper); }
    .screen-tab[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:var(--paper); }
    .screen-tab svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
    .screen-tab:hover { border-color:var(--ink); }
    .sleep-heading { margin-bottom:32px; }
    .sleep-heading h1 { margin:0; font-size:.78rem; letter-spacing:.16em; }
    .sleep-summary { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:42px; }
    .sleep-week { margin:0 0 10px; font-size:.88rem; font-variant-numeric:tabular-nums; }
    .sleep-hint { margin:0; color:var(--muted); font-size:.67rem; line-height:1.7; }
    .sleep-average { text-align:right; white-space:nowrap; }
    .sleep-average strong { display:block; margin:6px 0; font-size:1.35rem; font-variant-numeric:tabular-nums; }
    .sleep-short { color:#bd4b4b; }
    .sleep-met { color:#436fa8; }
    .sleep-empty { color:var(--muted); }
    .sleep-scroll { overflow-x:auto; padding-bottom:12px; }
    .sleep-grid { min-width:740px; }
    .sleep-table-head,.sleep-row { display:grid; grid-template-columns:76px 170px minmax(220px,1fr) 76px 28px; align-items:center; gap:12px; }
    .sleep-table-head { color:var(--muted); font-size:.62rem; padding-bottom:16px; }
    .sleep-axis { display:flex; justify-content:space-between; font-variant-numeric:tabular-nums; }
    .sleep-row { min-height:72px; margin:0; border-top:1px solid var(--line); }
    .sleep-day { font-size:.76rem; font-variant-numeric:tabular-nums; }
    .sleep-day small { margin-left:8px; color:var(--muted); font-size:.65rem; }
    .sleep-row.is-today .sleep-day { font-weight:700; }
    .sleep-row.is-future { opacity:.4; }
    .sleep-times { display:flex; align-items:center; justify-content:space-between; gap:5px; }
    .sleep-times input { width:76px; min-width:0; padding:6px 3px; border:0; border-bottom:1px solid transparent; background:transparent; font-size:.73rem; font-variant-numeric:tabular-nums; }
    .sleep-times input:focus { border-bottom-color:var(--ink); outline:none; }
    .sleep-times input::-webkit-calendar-picker-indicator { display:none; }
    .sleep-times span { color:var(--muted); font-size:.65rem; }
    .sleep-track { position:relative; height:32px; background:repeating-linear-gradient(to right,var(--line) 0,var(--line) 1px,transparent 1px,transparent 25%); border-right:1px solid var(--line); }
    .sleep-block { position:absolute; top:5px; height:22px; background:var(--ink); }
    .sleep-duration { text-align:right; font-size:.72rem; font-variant-numeric:tabular-nums; }
    .sleep-save { width:28px; height:28px; padding:0; border:0; background:transparent; color:var(--muted); font-size:.8rem; }
    .sleep-save:hover { color:var(--ink); }
    .sleep-history { margin-top:58px; padding-top:28px; border-top:1px solid var(--line); }
    .sleep-history h2 { margin:0 0 12px; font-size:.78rem; letter-spacing:.12em; }
    .sleep-history .sleep-summary { margin-bottom:26px; }
    .sleep-chart { display:block; width:100%; min-width:600px; height:auto; overflow:visible; }
    .sleep-chart text { fill:var(--muted); font-family:inherit; font-size:11px; }
    .sleep-chart .trend-line { fill:none; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
    .sleep-chart .trend-point { fill:var(--ink); }
    .sleep-chart .trend-point:hover,.sleep-chart .trend-point:focus { r:6; outline:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    main { width:min(960px,calc(100% - 40px)); margin:0 auto; padding:clamp(56px,9vw,104px) 0 140px; }
    section { padding:0 0 clamp(72px,11vw,128px); }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:38px; }
    .section-head h1,.section-head h2 { margin:0; font-size:.78rem; line-height:1; letter-spacing:.16em; font-weight:700; }
    .section-head span { font-size:.72rem; color:var(--muted); }

    .today-section { min-height:220px; }
    .task-list { width:min(720px,100%); }
    .empty { padding:22px 0; color:var(--muted); font-size:.86rem; }

    .today-routines { margin-top:32px; padding-top:18px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sub-label { margin-right:10px; font-size:.64rem; color:var(--muted); letter-spacing:.12em; }
    .routine-pill { height:28px; border:1px solid var(--ink); border-radius:999px; background:transparent; padding:0 11px; font-size:.68rem; transition:.18s; }
    .routine-pill.done { background:var(--ink); color:var(--paper); }

    .later { border-top:1px solid var(--line); padding-top:34px; }
    .task-row { min-height:56px; display:grid; grid-template-columns:18px minmax(0,1fr) 24px; align-items:center; gap:12px; border-bottom:1px solid var(--line); }
    .check { display:block; width:15px; height:15px; padding:0; border:1px solid var(--ink); border-radius:3px; background:transparent; transition:background .16s; }
    .check:hover { background:var(--ink); }
    .task-content { position:relative; width:100%; min-width:0; min-height:55px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:0 8px 0 0; border:0; border-radius:0; background:transparent; text-align:left; }
    .task-content:hover .row-title,.task-content:focus-visible .row-title { text-decoration:underline; text-underline-offset:4px; }
    .row-name { min-width:0; display:flex; align-items:center; gap:9px; }
    .group-dot { flex:none; width:8px; height:8px; border-radius:50%; background:var(--group-color); }
    .row-title { min-width:0; font-size:.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row-meta { font-size:.68rem; color:var(--muted); white-space:nowrap; }
    .note-popover { position:absolute; left:0; top:calc(100% - 4px); z-index:8; visibility:hidden; width:max-content; max-width:min(330px,76vw); padding:10px 12px; border-radius:8px; color:var(--paper); background:var(--ink); box-shadow:0 9px 26px rgba(0,0,0,.18); font-size:.72rem; line-height:1.6; white-space:normal; overflow-wrap:anywhere; opacity:0; transform:translateY(-3px); transition:opacity .15s,transform .15s,visibility .15s; pointer-events:none; }
    .task-content:hover .note-popover,.task-content:focus-visible .note-popover { visibility:visible; opacity:1; transform:translateY(0); }
    .delete { border:0; background:transparent; padding:0; opacity:.28; font-size:1rem; }
    .delete:hover { opacity:1; }

    .routines { border-top:1px solid var(--line); padding-top:30px; padding-bottom:0; }
    .routines .section-head { margin-bottom:20px; }
    .tracker-wrap { width:min(560px,100%); overflow-x:auto; padding-bottom:8px; }
    .tracker { min-width:440px; }
    .tracker-head,.tracker-row { display:grid; grid-template-columns:minmax(160px,1fr) repeat(7,18px); align-items:center; gap:8px; }
    .tracker-head { height:25px; font-size:.58rem; color:var(--muted); text-align:center; }
    .tracker-row { min-height:36px; border-top:1px solid var(--line); }
    .routine-info { min-width:0; display:flex; align-items:center; gap:6px; }
    .routine-name { min-width:0; flex:1; font-size:.72rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .routine-action { width:22px; height:22px; padding:0; border:0; background:transparent; color:var(--muted); font-size:.68rem; opacity:.5; }
    .routine-action:hover { color:var(--ink); opacity:1; }
    .day { display:block; width:18px; height:18px; padding:0; border-radius:50%; border:1px solid var(--line); background:transparent; }
    .day.is-today { border-color:var(--ink); }
    .day.done { background:var(--ink); border-color:var(--ink); }
    .day-cell { position:relative; width:18px; height:18px; }
    .day-note { position:absolute; top:-12px; right:1px; width:16px; height:16px; padding:0; border:0; border-radius:3px; color:var(--muted); background:var(--paper); font-size:11px; opacity:0; pointer-events:none; }
    .day-cell:hover .day-note,.day-cell:focus-within .day-note { opacity:1; pointer-events:auto; }
    .day-note:hover { color:var(--ink); }
    .routine-note-tooltip { position:fixed; z-index:18; max-width:min(300px,calc(100vw - 24px)); padding:10px 12px; border-radius:8px; color:var(--paper); background:var(--ink); font-size:.72rem; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; pointer-events:none; box-shadow:0 9px 26px rgba(0,0,0,.18); }
    .routine-note-tooltip[hidden] { display:none; }
    @media (hover:none) { .day-note { opacity:.65; pointer-events:auto; } }

    .hangar { border-top:1px solid var(--line); padding-top:30px; padding-bottom:0; }
    .hangar .section-head { margin-bottom:18px; }
    .hangar-list { width:min(560px,100%); }
    .hangar-item { min-height:42px; display:grid; grid-template-columns:14px minmax(0,1fr) auto auto; align-items:center; gap:12px; border-top:1px solid var(--line); }
    .hangar-dot { width:9px; height:9px; border-radius:50%; background:var(--ink); opacity:.35; }
    .hangar-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:.76rem; text-decoration:line-through; }
    .hangar-time { color:var(--muted); font-size:.64rem; }
    .restore { padding:5px 9px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--muted); font-size:.65rem; }
    .restore:hover { border-color:var(--ink); color:var(--ink); }

    .groups { border-top:1px solid var(--line); padding-top:30px; padding-bottom:70px; }
    .groups .section-head { margin-bottom:18px; }
    .group-list { width:min(560px,100%); }
    .group-row { min-height:43px; display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); font-size:.76rem; }
    .group-row span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .color-input { width:28px; height:28px; padding:2px; border:1px solid var(--line); border-radius:50%; background:transparent; cursor:pointer; }
    .color-input::-webkit-color-swatch-wrapper { padding:0; }
    .color-input::-webkit-color-swatch { border:0; border-radius:50%; }
    .color-input::-moz-color-swatch { border:0; border-radius:50%; }
    .group-add { display:flex; align-items:center; gap:12px; width:min(560px,100%); margin-top:12px; }
    .group-add input { width:min(220px,65%); height:35px; padding:0 10px; border:1px solid var(--line); border-radius:6px; background:transparent; font-size:.76rem; }
    .group-add button { border:0; background:transparent; color:var(--muted); font-size:.76rem; }
    .group-add button:hover { color:var(--ink); }

    .inline-add { display:block; margin-top:18px; padding:5px 0; border:0; background:transparent; color:var(--muted); font-size:.76rem; text-align:left; }
    .inline-add:hover { color:var(--ink); }

    .add-button { position:fixed; right:clamp(20px,4vw,50px); bottom:28px; z-index:10; width:54px; height:54px; border:0; border-radius:50%; color:var(--paper); background:var(--ink); font-size:1.5rem; line-height:1; box-shadow:0 10px 28px rgba(0,0,0,.16); transition:transform .2s; }
    .add-button:hover { transform:scale(1.06); }

    .backdrop { position:fixed; inset:0; z-index:20; display:none; pointer-events:none; }
    .backdrop.open { display:block; }
    .composer { position:fixed; top:14vh; left:50%; transform:translateX(-50%); width:min(520px,calc(100vw - 32px)); max-height:80vh; overflow:auto; padding:26px; border:1px solid var(--ink); border-radius:16px; background:var(--paper); box-shadow:0 16px 44px rgba(0,0,0,.18); pointer-events:auto; }
    .composer-head { display:flex; align-items:center; justify-content:space-between; margin:-8px -6px 18px; padding:8px 6px; cursor:grab; user-select:none; touch-action:none; }
    .composer-head:active { cursor:grabbing; }
    .composer-head span { font-size:.7rem; font-weight:700; letter-spacing:.14em; }
    .close { border:0; background:transparent; padding:4px; font-size:1.2rem; }
    .title-input { width:100%; border:0; border-bottom:1px solid var(--ink); outline:0; background:transparent; padding:10px 0 12px; font-size:1rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:25px; }
    .field label,.field-title { display:block; margin-bottom:10px; font-size:.68rem; font-weight:700; letter-spacing:.1em; }
    .group-input,.date-input { width:100%; height:38px; padding:0 13px; border:1px solid var(--line); border-radius:999px; background:transparent; font-size:.78rem; }
    .choices { display:flex; gap:6px; flex-wrap:wrap; }
    .choice { position:relative; }
    .choice input { position:absolute; opacity:0; }
    .choice span { display:block; padding:8px 11px; border:1px solid var(--line); border-radius:999px; font-size:.7rem; }
    .choice input:checked+span { color:var(--paper); background:var(--ink); border-color:var(--ink); }
    .repeat { grid-column:1/-1; padding-top:18px; border-top:1px solid var(--line); }
    .repeat-line { display:flex; align-items:center; justify-content:space-between; font-size:.78rem; }
    .switch { width:42px; height:23px; padding:3px; border:0; border-radius:999px; background:var(--line); }
    .switch::after { content:""; display:block; width:17px; height:17px; border-radius:50%; background:var(--paper); transition:.18s; }
    .switch.on { background:var(--ink); }
    .switch.on::after { transform:translateX(19px); }
    .weekdays { display:none; gap:6px; margin-top:16px; flex-wrap:wrap; }
    .weekdays.show { display:flex; }
    .submit-row { display:flex; justify-content:flex-end; margin-top:26px; }
    .submit { border:0; border-radius:999px; color:var(--paper); background:var(--ink); padding:11px 21px; font-size:.72rem; font-weight:700; }
    .composer.routine-mode .due-field,.composer.routine-mode .repeat-line { display:none; }
    .composer.routine-mode .weekdays { display:flex; }
    .memo-context { display:none; margin:0; font-size:.8rem; line-height:1.6; overflow-wrap:anywhere; }
    .composer.daily-memo { width:min(390px,calc(100vw - 32px)); }
    .composer.daily-memo .title-input,.composer.daily-memo .due-field,.composer.daily-memo .group-field,.composer.daily-memo .repeat { display:none; }
    .composer.daily-memo .memo-context { display:block; }
    .memo-field { grid-column:1/-1; }
    .composer.routine-mode .memo-field,.composer.repeating .memo-field,.composer.edit-task .repeat { display:none; }

    .note-input { display:block; width:100%; min-height:130px; resize:vertical; padding:12px; border:1px solid var(--line); border-radius:10px; outline:0; background:transparent; font:inherit; font-size:.8rem; line-height:1.65; }
    .note-input:focus { border-color:var(--ink); }

    @media (max-width:700px) {
      main { width:calc(100% - 84px); margin-left:16px; padding-top:48px; }
      header { padding:0 16px; }
      .brand-group { gap:12px; }
      .screen-nav { right:12px; gap:10px; }
      .screen-tab { width:36px; height:36px; }
      .sleep-summary { gap:12px; flex-wrap:wrap; }
      .sleep-average strong { font-size:1.15rem; }
      section { padding-bottom:84px; }
      .row-meta { max-width:88px; overflow:hidden; text-overflow:ellipsis; }
      .tracker-head,.tracker-row { grid-template-columns:minmax(140px,1fr) repeat(7,18px); }
      .composer { top:70px; left:10px; width:calc(100vw - 20px); max-height:calc(100vh - 90px); transform:none; padding:22px 18px; }
      .form-grid { grid-template-columns:1fr; }
      .repeat { grid-column:1; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header><div class="brand-group"><div class="brand"><i></i><span>MONO</span></div><span class="screen-label" id="screenLabel">task&amp;routine</span></div><div class="date" id="date"></div></header>
  <nav class="screen-nav" role="tablist" aria-label="画面切り替え" aria-orientation="vertical">
    <button class="screen-tab" id="tasksTab" type="button" role="tab" aria-label="task&routine" aria-controls="taskScreen" aria-selected="true" title="task&routine"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6 2 2 3-4M12 6h8M4 13h4v4H4zM12 15h8"/></svg></button>
    <button class="screen-tab" id="healthTab" type="button" role="tab" aria-label="health" aria-controls="healthScreen" aria-selected="false" tabindex="-1" title="health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.4A8.5 8.5 0 0 1 9.6 4 8.5 8.5 0 1 0 20 14.4Z"/></svg></button>
  </nav>
  <main id="taskScreen" role="tabpanel" aria-labelledby="tasksTab">
    <section class="today-section"><div class="section-head"><h1>TODAY</h1><span id="todayCount"></span></div><div class="task-list" id="todayTasks"></div><button class="inline-add" type="button" data-add-due="today">＋ タスクを追加</button><div class="today-routines" id="todayRoutines"></div></section>
    <section class="later"><div class="section-head"><h2>NEXT 7 DAYS</h2><span id="weekCount"></span></div><div class="task-list" id="weekTasks"></div><button class="inline-add" type="button" data-add-due="tomorrow">＋ タスクを追加</button></section>
    <section class="later"><div class="section-head"><h2>LATER</h2><span id="laterCount"></span></div><div class="task-list" id="laterTasks"></div><button class="inline-add" type="button" data-add-due="after7">＋ タスクを追加</button></section>
    <section class="routines"><div class="section-head"><h2>ROUTINE</h2><span id="routineCount"></span></div><div class="tracker-wrap"><div class="tracker" id="tracker"></div></div><button class="inline-add" type="button" id="addRoutine">＋ ルーティーンを追加</button></section>
    <section class="hangar"><div class="section-head"><h2>HANGAR</h2><span id="hangarCount">3 DAYS</span></div><div class="hangar-list" id="hangarList"></div></section>
    <section class="groups"><div class="section-head"><h2>GROUPS</h2><span id="groupCount"></span></div><div class="group-list" id="groupList"></div><form class="group-add" id="groupAdd"><input id="newGroup" maxlength="24" autocomplete="off" placeholder="グループ名" aria-label="新しいグループ名" required /><button type="submit">＋ グループを追加</button></form></section>
  </main>
  <main id="healthScreen" role="tabpanel" aria-labelledby="healthTab" hidden>
    <div class="sleep-heading"><h1>SLEEP</h1></div>
    <div class="sleep-summary"><div><p class="sleep-week" id="sleepWeek"></p></div></div>
    <div class="sleep-scroll"><div class="sleep-grid"><div class="sleep-table-head" aria-hidden="true"><span>起床日</span><span>就寝 → 起床</span><div class="sleep-axis"><span>18:00</span><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span></div><span style="text-align:right">睡眠時間</span><span></span></div><div id="sleepRows"></div></div></div>
    <div id="sleepStatus" class="sr-only" role="status" aria-live="polite"></div>
    <section class="sleep-history"><div class="sleep-summary"><div><h2>LAST 30 DAYS</h2><p class="sleep-hint" id="sleepHistoryRange"></p></div><div class="sleep-average"><span class="sleep-hint">平均</span><strong id="sleepAverage">—</strong></div></div><div class="sleep-scroll" id="sleepChart"></div></section>
  </main>
  <button class="add-button" id="openComposer" aria-label="タスクを追加">＋</button>
  <div class="backdrop" id="backdrop" role="dialog" aria-labelledby="composerTitle">
    <form class="composer" id="composer">
      <div class="composer-head"><span id="composerTitle">NEW</span><button class="close" type="button" id="closeComposer" aria-label="閉じる">×</button></div>
      <input class="title-input" id="titleInput" maxlength="80" autocomplete="off" placeholder="タスク名" required />
      <p class="memo-context" id="memoContext"></p>
      <div class="form-grid">
        <div class="field due-field"><span class="field-title">期限</span><div class="choices">

<script id="sleep-model">
const Sleep = (()=>{
  const pad=n=>String(n).padStart(2,'0');
  const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const fromKey=k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k||''))return null;const d=new Date(`${k}T12:00:00`);return Number.isFinite(+d)&&dateKey(d)===k?d:null};
  const shift=(k,n)=>{const d=fromKey(k);if(!d)return'';d.setDate(d.getDate()+n);return dateKey(d)};
  const minutes=t=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t||''))return null;const [h,m]=t.split(':').map(Number);return h*60+m};
  const duration=(bed,wake)=>{const b=minutes(bed),w=minutes(wake);if(b===null||w===null||b===w)return null;return(w-b+1440)%1440};
  const summary=records=>{let totalMinutes=0,count=0;for(const r of records){const n=duration(r?.bed,r?.wake);if(n!==null){totalMinutes+=n;count++}}return{totalMinutes,count}};
  const average=s=>s.count?s.totalMinutes/s.count:null;
  const format=n=>{if(n===null)return'—';const m=Math.floor(n);return`${Math.floor(m/60)}h${pad(m%60)}m`};
  const tone=n=>n===null?'sleep-empty':n<420?'sleep-short':'sleep-met';
  const segments=(bed,wake)=>{const n=duration(bed,wake);if(n===null)return[];const start=(minutes(bed)+360)%1440,first=Math.min(n,1440-start);return[{start,length:first},...(first<n?[{start:0,length:n-first}]:[])]};
  const windowDates=today=>Array.from({length:7},(_,i)=>shift(today,i-2));
  const history=(data,today)=>Array.from({length:30},(_,i)=>{const date=shift(today,i-29),r=data.days[date];return{date,minutes:duration(r?.bed,r?.wake)}});
  function prune(data,today){const start=shift(today,-29);let changed=false;for(const date of Object.keys(data.days)){if(fromKey(date)&&date>=start&&date<=today)continue;delete data.days[date];changed=true}if(Object.hasOwn(data,'archives')){delete data.archives;changed=true}return changed}
  return{dateKey,fromKey,shift,minutes,duration,summary,average,format,tone,segments,windowDates,history,prune};
})();
</script>

  const rangeLabel=(start,end)=>`${start.replaceAll('-','.')} — ${end.slice(5).replace('-','.')}`;
  function renderTrend(date){
    const records=Sleep.history(health,date),valid=records.filter(r=>r.minutes!==null),avg=valid.length?valid.reduce((n,r)=>n+r.minutes,0)/valid.length:null;
    $('#sleepHistoryRange').textContent=rangeLabel(records[0].date,date);$('#sleepAverage').textContent=Sleep.format(avg);$('#sleepAverage').className=Sleep.tone(avg);
    const left=38,right=868,top=18,bottom=210,maxHours=Math.max(10,Math.ceil(Math.max(0,...valid.map(r=>r.minutes/60))/2)*2),x=i=>left+(right-left)*i/29,y=n=>bottom-(bottom-top)*n/(maxHours*60);
    const grid=[0,maxHours/2,maxHours].map(h=>`<line x1="${left}" y1="${y(h*60)}" x2="${right}" y2="${y(h*60)}" stroke="var(--line)"/><text x="26" y="${y(h*60)+4}" text-anchor="end">${h}h</text>`).join('');
    const goal=`<line x1="${left}" y1="${y(420)}" x2="${right}" y2="${y(420)}" stroke="var(--muted)" stroke-dasharray="3 5" opacity=".5"/><text x="${right+8}" y="${y(420)+4}">7h</text>`;
    const ticks=[0,7,14,21,29].map(i=>`<text x="${x(i)}" y="235" text-anchor="middle">${records[i].date.slice(5).replace('-','/')}</text>`).join('');
    const paths=[];let run=[];for(let i=0;i<records.length;i++){const r=records[i];if(r.minutes===null){if(run.length>1)paths.push(run.join(' '));run=[]}else run.push(`${x(i)},${y(r.minutes)}`)}if(run.length>1)paths.push(run.join(' '));
    const lines=paths.map(points=>`<polyline class="trend-line" points="${points}"/>`).join('');
    const points=records.map((r,i)=>r.minutes===null?'':`<circle class="trend-point" cx="${x(i)}" cy="${y(r.minutes)}" r="4" tabindex="0" role="img" aria-label="${r.date} ${Sleep.format(r.minutes)}"><title>${r.date} · ${Sleep.format(r.minutes)}</title></circle>`).join('');
    const empty=valid.length?'':`<text x="450" y="120" text-anchor="middle">記録なし</text>`;
    $('#sleepChart').innerHTML=`<svg class="sleep-chart" viewBox="0 0 900 250" role="img" aria-label="過去30日間の日別睡眠時間。未入力日は点を表示しません。">${grid}${goal}${ticks}${lines}${points}${empty}</svg>`;
  }
  function renderHealth(){
    const date=today();if(Sleep.prune(health,date))persist();
    const dates=Sleep.windowDates(date);
    $('#sleepWeek').textContent=rangeLabel(dates[0],dates[6]);
    $('#sleepRows').innerHTML=dates.map(d=>{
      const r=health.days[d]||{},future=d>date,disabled=future?'disabled':'',n=Sleep.duration(r.bed,r.wake),day=Sleep.fromKey(d);
      const bars=Sleep.segments(r.bed,r.wake).map(s=>`<i class="sleep-block" style="left:${s.start/14.4}%;width:${s.length/14.4}%" aria-hidden="true"></i>`).join('');
      const description=n===null?'未記録':`${r.bed}就寝、${r.wake}起床、${Sleep.format(n)}`;
      return`<form class="sleep-row ${d===date?'is-today':''} ${future?'is-future':''}" data-sleep-date="${d}" aria-label="${d}の睡眠"><span class="sleep-day">${day.getMonth()+1}/${day.getDate()}<small>${WEEKDAYS[day.getDay()]}</small></span><div class="sleep-times"><input type="time" name="bed" step="60" value="${Sleep.minutes(r.bed)!==null?r.bed:''}" aria-label="${d}の就寝時刻" ${disabled}><span aria-hidden="true">→</span><input type="time" name="wake" step="60" value="${Sleep.minutes(r.wake)!==null?r.wake:''}" aria-label="${d}の起床時刻" ${disabled}></div><div class="sleep-track" role="img" aria-label="${description}" title="${description}">${bars}</div><span class="sleep-duration">${Sleep.format(n)}</span><button class="sleep-save" type="submit" aria-label="${d}の睡眠を保存" title="保存" ${disabled}>✓</button></form>`;
    }).join('');
    renderTrend(date);
  }
  $('#sleepRows').addEventListener('input',e=>{if(e.target.matches('input'))e.target.setCustomValidity('')});
  $('#sleepRows').addEventListener('submit',e=>{
    e.preventDefault();const form=e.target.closest('[data-sleep-date]');if(!form)return;const date=form.dataset.sleepDate;
    if(date<Sleep.shift(today(),-2)||date>today()){renderHealth();$('#sleepStatus').textContent='日付が変わりました。表示中の記録を確認してください。';return}
    const bed=form.elements.bed,wake=form.elements.wake;
    if(!bed.value&&!wake.value){delete health.days[date]}else{
      if(!bed.value||!wake.value){const missing=!bed.value?bed:wake;missing.setCustomValidity('就寝時刻と起床時刻を入力してください。');missing.reportValidity();return}
      if(Sleep.duration(bed.value,wake.value)===null){wake.setCustomValidity('就寝時刻と異なる起床時刻を入力してください。');wake.reportValidity();return}
      health.days[date]={bed:bed.value,wake:wake.value};
    }
    persist();renderHealth();$('#sleepStatus').textContent=`${date}の睡眠を保存しました。`;
  });
  function setScreen(screen){
    const isHealth=screen==='health';$('#closeComposer').click();$('#routineNoteTooltip').hidden=true;
    $('#taskScreen').hidden=isHealth;$('#healthScreen').hidden=!isHealth;$('#openComposer').hidden=isHealth;$('#screenLabel').textContent=isHealth?'health':'task&routine';
    for(const [id,selected] of [['tasksTab',!isHealth],['healthTab',isHealth]]){$('#'+id).setAttribute('aria-selected',String(selected));$('#'+id).tabIndex=selected?0:-1}
    if(isHealth)renderHealth();window.scrollTo({top:0,behavior:'instant'});
  }
  const navigate=screen=>{const hash=screen==='health'?'#health':'#tasks';if(location.hash===hash)setScreen(screen);else location.hash=hash};
  $('#tasksTab').addEventListener('click',()=>navigate('tasks'));$('#healthTab').addEventListener('click',()=>navigate('health'));
  $('.screen-nav').addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();const screen=e.key==='Home'?'tasks':e.key==='End'?'health':$('#taskScreen').hidden?'tasks':'health';navigate(screen);$('#'+(screen==='health'?'healthTab':'tasksTab')).focus()});
  window.addEventListener('hashchange',()=>setScreen(location.hash==='#health'?'health':'tasks'));
  let lastDate=today();const rollover=()=>{if(today()===lastDate)return;lastDate=today();if(Sleep.prune(health,lastDate))persist();if(!$('#healthScreen').hidden)renderHealth();$('#date').textContent=`${String(new Date().getMonth()+1).padStart(2,'0')}.${String(new Date().getDate()).padStart(2,'0')} ${WEEKDAYS[new Date().getDay()]}`};
  setInterval(rollover,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollover()});window.addEventListener('focus',rollover);
  if(Sleep.prune(health,today()))persist();setScreen(location.hash==='#health'?'health':'tasks');
})();
</script>
</body>
</html>
